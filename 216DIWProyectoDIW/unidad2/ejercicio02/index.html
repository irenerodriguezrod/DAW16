<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irene Rodríguez - Fotografía</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <img src="webroot/media/logo.jpg" alt="Logo">
        </div>

        <div class="search-container">
            <input type="text" placeholder="Buscar proyectos anteriores...">
        </div>

        <button class="header-btn">Buscar</button>
    </header>

    <!-- NAV -->
    <nav class="menu">
        <button>Proyecto 2020</button>
        <button>Proyecto 2021</button>
        <button>Proyecto 2022</button>
        <button>Proyecto 2023</button>
        <button>Proyecto 2024</button>
        <button>Proyecto 2025</button>
    </nav>

    <!-- 3 CUADRADOS GRANDES -->
    <section class="top-cards">
        <div class="big-card">
            <img src="webroot/media/tui.jpg" alt="Imagen de Tui">
        </div>
        <div class="big-card">
            <img src="webroot/media/valenca.jpg" alt="Imagen de Valença do Minho">
        </div>
        <div class="big-card">
            <img src="webroot/media/barcelona.jpg" alt="Imagen de Barcelona">
        </div>
    </section>

    <!-- ZONA INFERIOR -->
    <section class="bottom-section">

        <aside class="sidebar">
            <p>Consulta nuestros mejores proyectos</p>
        </aside>

        <div class="products">
            <div class="product">
                <img src="webroot/media/cinera.jpg" alt="Imagen de Ciñera">
                <p>Ciñera, España</p>
            </div>

            <div class="product">
                <img src="webroot/media/galicia.jpg" alt="Imagen de Galicia">
                <p>Galicia</p>
            </div>

            <div class="product">
                <img src="webroot/media/astorga.jpg" alt="Imagen de Astorga">
                <p>Astorga, España</p>
            </div>

            <div class="product">
                <img src="webroot/media/braganca.jpg" alt="Imagen de Bragança">
                <p>Bragança, Portugal</p>
            </div>

            <div class="product">
                <img src="webroot/media/lugo.jpg" alt="Imagen de Lugo">
                <p>Lugo, España</p>
            </div>

            <div class="product">
                <img src="webroot/media/zamora.jpg" alt="Imagen de Zamora">
                <p>Zamora, España</p>
            </div>

            <div class="product">
                <img src="webroot/media/vsanabria.jpg" alt="Imagen de Vigo de Sanabria">
                <p>Vigo de Sanabria, España</p>
            </div>

            <div class="product">
                <img src="webroot/media/sanabria.jpg" alt="Imagen de Sanabria">
                <p>Sanabria, España</p>
            </div>
        </div>

    </section>

</body>
</html>
