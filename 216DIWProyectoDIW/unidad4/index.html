<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad jQuery - DAW</title>
    <link rel="stylesheet" href="css/styles.css">

    <!-- ===================== EJERCICIO 1 ===================== -->
    <!-- 1.1) Vincula aquí la librería jQuery (CDN o local)      -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- ===================== EJERCICIO 3 ===================== -->
    <!-- 3.1) Vincula aquí el CSS del plugin Slick               -->
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css" />
</head>

<body>

    <header>
        <h1>Actividad jQuery</h1>
        <p class="subtitle">Desarrollo de Aplicaciones Web — Interactividad con jQuery</p>
    </header>

    <main>

        <!-- ==================== EJERCICIO 1 ==================== -->
        <section class="exercise" id="exercise1">
            <h2>Ejercicio 1 — Manipulación de imagen</h2>

            <div class="exercise-content">
                <div class="controls">
                    <button id="resizeImg">Doble clic: Redimensionar</button>
                    <button id="setBorderRed">Hover: Borde rojo</button>
                    <button id="fadeImg">Clic: Fade In / Out</button>
                </div>

                <div class="media-container">
                    <img id="multimedia" src="img/img1.jpg" alt="Imagen multimedia">
                </div>
            </div>
        </section>


        <!-- ==================== EJERCICIO 2 ==================== -->
        <section class="exercise" id="exercise2">
            <h2>Ejercicio 2 — Añadir y eliminar elementos</h2>

            <div class="exercise-content">
                <div class="caption-form">
                    <input type="text" id="captionText" placeholder="Escribe un texto...">
                    <button id="addCaption">Añadir párrafo</button>
                </div>

                <div id="captions">
                    <!-- 2.1) Aquí se añadirán los párrafos dinámicamente -->
                </div>
            </div>
        </section>


        <!-- ==================== EJERCICIO 3 ==================== -->
        <section class="exercise" id="exercise3">
            <h2>Ejercicio 3 — Slider con Slick</h2>

            <div class="exercise-content">

                <!-- 3.3) Añade aquí los botones personalizados NEXT y PREV -->


                <div id="gallery">
                    <div><img src="img/img1.jpg" alt="Slide 1"></div>
                    <div><img src="img/img2.jpg" alt="Slide 2"></div>
                    <div><img src="img/img3.jpg" alt="Slide 3"></div>
                    <div><img src="img/img4.jpg" alt="Slide 4"></div>
                    <div><img src="img/img5.jpg" alt="Slide 5"></div>
                    <div><img src="img/img6.jpg" alt="Slide 6"></div>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <p>DAW — Actividad jQuery</p>
    </footer>


    <!-- ===================== EJERCICIO 3 ===================== -->
    <!-- 3.1) Vincula aquí el JS del plugin Slick                -->


    <!-- Script principal del alumno -->
    <script src="js/script.js"></script>

</body>

</html>
