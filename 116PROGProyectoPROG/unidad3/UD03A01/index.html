    <!-- CSS propio -->

    <!-- Prism.js -->

</head>

<body>

    <header>
        <h1>UD03 · Programación en Java</h1>
        <p>Actividad A01 · Bucle <i>if</i> en Java</p>
    </header>

    <nav class="navegacion-secundaria">
        <a href="../../index.html" class="btn-inicio">← Volver a inicio</a>
    </nav>

    <main>

        <section id="contenedor-ejercicios">
            <!-- Carga automática de ejercicios -->
        </section>

    </main>

    <footer>
        <a href="https://github.com/irenerodriguezrod/DAW16" target="_blank" rel="noopener" title="GitHub">
            <!--GitHub-->
            <i class="fa-brands fa-github github-icon"></i>
        </a>
        <p>2024-2026 Todos los derechos reservados. &#169; <a href="/index.html">Irene Rodríguez
                Rodríguez</a></p>
        <p>Fecha de actualización: <time datetime="2026-02-18">18 de febrero de 2026</time></p>
    </footer>

    <!-- Prism.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>

    <script>
        const ejercicios = [
            { archivo: "Ejercicio01.java", titulo: "Ejercicio 1 · Mayor de edad" },
            { archivo: "Ejercicio02.java", titulo: "Ejercicio 2 · Cambiar de signo a un número" },
            { archivo: "Ejercicio03.java", titulo: "Ejercicio 3 · 2 números iguales" },
            { archivo: "Ejercicio04.java", titulo: "Ejercicio 4 · Media de 2 números positivos" },
            { archivo: "Ejercicio05.java", titulo: "Ejercicio 5 · Intercambio de 2 valores" },
            { archivo: "Ejercicio06.java", titulo: "Ejercicio 6 · Calificación correcta" },
            { archivo: "Ejercicio07.java", titulo: "Ejercicio 7 · Número entre 1 y 12" },
            { archivo: "Ejercicio08.java", titulo: "Ejercicio 8 · Resultado de división" },
            { archivo: "Ejercicio09.java", titulo: "Ejercicio 9 · Suma de 3 ángulos igual a 180" }
        ];

        async function cargarEjercicios() {
            const contenedor = document.getElementById("contenedor-ejercicios");

            for (const ej of ejercicios) {
                try {
                    const res = await fetch(`./${ej.archivo}`);
                    if (!res.ok) throw new Error();

                    const codigo = await res.text();

                    const bloque = document.createElement("section");
                    bloque.classList.add("ejercicio");

                    bloque.innerHTML = `
                <header>
                    <h2>${ej.titulo}</h2>
                </header>
                <pre><code class="language-java">${codigo}</code></pre>
            `;

                    contenedor.appendChild(bloque);
                    Prism.highlightElement(bloque.querySelector("code"));

                } catch (e) {
                    console.error("Error cargando", ej.archivo);
                }
            }
        }

        cargarEjercicios();
    </script>

</body>

</html>
